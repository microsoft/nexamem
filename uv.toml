# UV Configuration for NexaMem/AIMemory
# Simplified configuration - all essentials included by default

[workspace]
members = [".", "examples"]

[tool.uv]
# Faster dependency resolution
resolver = "uv"

# Use specific Python version for consistency
python = "3.8"

# Development dependencies (only needed for contributors)
dev-dependencies = [
    "pytest>=7.0.0,<8.0",
    "pytest-asyncio>=0.21.0,<1.0",
    "pytest-cov>=4.0.0,<5.0",
    "black>=23.0.0,<24.0",
    "mypy>=1.0.0,<2.0",
    "ruff>=0.1.0,<1.0",
    "pre-commit>=3.0.0,<4.0"
]

# Index configuration for private registries (if needed)
[tool.uv.index]
# index-url = "https://pypi.org/simple/"
# extra-index-url = ["https://test.pypi.org/simple/"]

# Lock file configuration
[tool.uv.lock]
# Generate platform-specific lock files
require-hashes = true
