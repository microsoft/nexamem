# Valid channels.yaml example
# This configuration passes all schema validation checks

channels:
  # Core conversational memory
  working:
    ttl_sec: 14400        # 4 hours (valid range: 60-604800)
    encrypt: true         # Boolean: true/false
    quota_bytes: 1000000  # 1MB (valid range: 1 to 1GB)

  # Long-term workflow state
  procedure:
    ttl_sec: 604800       # 7 days (maximum allowed)
    encrypt: true

  # Short-term routing hints
  routing:
    ttl_sec: 86400        # 24 hours
    encrypt: false

  # Team-specific channels
  debug_logs:
    ttl_sec: 3600         # 1 hour
    encrypt: false
    quota_bytes: 500000   # 500KB

  user_context:
    ttl_sec: 43200        # 12 hours
    encrypt: true
    quota_bytes: 2000000  # 2MB
