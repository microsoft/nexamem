# This is an example of an INVALID channels.yaml file that will fail schema validation

channels:
  # This channel name has invalid characters (hyphens)
  Invalid-Channel-Name:
    ttl_sec: 14400
    encrypt: true
  
  # This channel has TTL that exceeds 7 days limit  
  working:
    ttl_sec: 999999  # Invalid: over 604800 (7 days)
    encrypt: true
    
  # This channel uses a reserved name
  admin:
    ttl_sec: 3600
    encrypt: false
    
  # This channel has unknown fields
  routing:
    ttl_sec: 86400
    encrypt: false
    unknown_field: "not allowed"  # Invalid field
    
  # This channel has negative quota
  procedure:
    ttl_sec: 604800
    encrypt: true
    quota_bytes: -1000  # Invalid: negative
