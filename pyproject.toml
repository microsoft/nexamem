[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nexamem"
version = "0.4.2"
description = "Azure-focused conversational memory storage with sync/async APIs, local backends, and optional OpenTelemetry."
authors = [
    { name="Chad Adams", email="chadada@microsoft.com" }
]
maintainers = [
    { name="Chad Adams", email="chadada@microsoft.com" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core dependencies
    "pydantic>=2.14.1,<3.0",
    
    # Redis dependencies (with async support)
    "redis>=8.1.0,<9.0",
    "fakeredis>=2.40.0,<3.0",
    
    # YAML configuration support
    "PyYAML>=6.0.3,<7.0",
    
    # Azure identity for Entra ID authentication
    "azure-identity>=1.27.0,<2.0",
    "azure-keyvault-secrets>=4.12.0,<5.0",
]
keywords = [
    "aimemory", "nexamem", "chatbot", "conversation", "memory", "llm", "ai", 
    "redis", "azure", "governance", "policy", "audit", "compliance", 
    "pii", "content-processing", "enterprise", "async", "channels"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: System :: Logging",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Typing :: Typed"
]

[project.optional-dependencies]
telemetry = [
    "opentelemetry-api>=1.45.1,<2.0",
]
appinsights = [
    "nexamem[telemetry]",
    "azure-monitor-opentelemetry>=1.8.11,<2.0",
]

# Development and testing dependencies  
dev = [
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "pytest-cov>=7.1.0,<8.0",
    "mypy>=2.4.0,<3.0",
    "ruff>=0.17.3,<1.0",
    "pre-commit>=4.7.0,<5.0",
    "pip-tools>=7.6.2,<8.0",
    "build>=1.6.1,<2.0",
    "twine>=7.0.0,<8.0",
    "types-PyYAML",
    "opentelemetry-sdk>=1.45.1,<2.0",
]

# Documentation dependencies
docs = [
    "mkdocs>=1.6.1,<2.0",
    "mkdocs-material>=9.7.7,<10.0",
    "mkdocstrings[python]>=1.0.8,<2.0"
]

# Performance testing
perf = [
    "pytest-benchmark>=5.3.0,<6.0",
    "memory-profiler>=0.61.0,<1.0"
]

# All optional dependencies (dev tools only)
all = [
    "nexamem[dev,docs,perf]"
]

[project.urls]
"Homepage" = "https://github.com/microsoft/nexamem"
"Documentation" = "https://github.com/microsoft/nexamem/blob/main/README.md"
"Repository" = "https://github.com/microsoft/nexamem.git"
"Bug Tracker" = "https://github.com/microsoft/nexamem/issues"
"Changelog" = "https://github.com/microsoft/nexamem/releases"
"Discussions" = "https://github.com/microsoft/nexamem/discussions"

# Tool configurations for development

[tool.setuptools.packages.find]
where = ["src"]
include = ["nexamem*"]

[tool.setuptools.package-data]
nexamem = ["*.yaml", "*.yml", "py.typed"]

# Ruff linting
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E501",  # line too long, handled by Ruff format
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "ARG002", # unused method argument
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["ARG", "SIM"]
"src/nexamem/config/storage.py" = ["UP042"]

# MyPy type checking
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "fakeredis.*",
    "redis.*",
    "azure.*",
    "yaml.*"
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "9.1"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "redis: marks tests that require Redis",
    "azure: marks tests that require Azure services",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Coverage configuration
[tool.coverage.run]
source = ["src/nexamem"]

[tool.coverage.report]
fail_under = 90
precision = 2
exclude_lines = ["pragma: no cover"]
