[build-system]
requires = ["setuptools>=68.0", "wheel", "build>=1.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexamem"
version = "0.3.3"
description = "NexaMem - A Python package to store and manage chatbot conversation history."
authors = [
    { name="Chad Adams", email="chadada@microsoft.com" }
]
maintainers = [
    { name="Chad Adams", email="chadada@microsoft.com" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.0",
    "fakeredis>=2.21.0",
    "redis>=5.0.0",
    "azure-identity>=1.12.0"
]
keywords = ["chatbot", "history", "llm", "openai", "sqlite", "conversation", "memory", "file", "python", "redis", "azure", "cache", "distributed", "entra-id", "authentication", "enum", "type-safe", "uv", "modern-python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0"
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0"
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0"
]

[project.urls]
"Homepage" = "https://github.com/microsoft/nexamem"
"Bug Tracker" = "https://github.com/microsoft/nexamem/issues"
"Documentation" = "https://github.com/microsoft/nexamem/blob/main/README.md"
"Repository" = "https://github.com/microsoft/nexamem"
"Changelog" = "https://github.com/microsoft/nexamem/blob/main/CHANGELOG.md"

# uv-specific optimizations
[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "build>=1.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0"
]

# Tool configurations for better development experience
[tool.ruff]
target-version = "py38"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "DJ", "EM", "EXE", "FA", "ISC", "ICN", "LOG", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "TD", "FIX", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "RUF"]
ignore = ["S101", "T201", "ERA001"]  # Allow assert, print, commented code

[tool.black]
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
line-length = 100
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
