name: Publish distributions

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "packaging>=26,<27"
      - name: Require a unique candidate or an exact stable release tag
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from packaging.version import Version

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          parsed = Version(version)
          if parsed.local or parsed.is_devrelease:
              raise SystemExit("Use a unique release candidate or stable version, not a local/dev version")
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              if os.environ["GITHUB_REF_NAME"] != f"v{version}" or parsed.is_prerelease:
                  raise SystemExit("Production tags must exactly match a stable package version")
          elif not parsed.is_prerelease:
              raise SystemExit("TestPyPI requires a unique prerelease version, such as 1.0.0rc1")
          PY

  ci:
    needs: validate-version
    uses: ./.github/workflows/ci.yml

  publish-to-pypi:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nexamem
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-testpypi:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/nexamem
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true