name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -e .
        
    - name: Run unit tests
      run: |
        python -m pytest tests/ -v --tb=short
        
    - name: Test installation verification
      run: |
        python -c "
        from nexamem import AIMemory, MemoryScope
        memory = AIMemory(use_fakeredis=True)
        scope = MemoryScope(agent_id='test', user_id='user', session_id='session', env='test')
        print('NexaMem installation verified successfully')
        "
        
    - name: Run tests with coverage (Ubuntu + Python 3.10 only)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      run: |
        python -m pytest tests/ --cov=nexamem --cov-report=xml --cov-report=term-missing
        
    - name: Upload coverage to Codecov (if available)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false  # Don't fail if codecov is not configured

  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy
        pip install -e .
        
    - name: Run ruff linting
      run: |
        ruff check src/ tests/ || echo "Ruff linting found issues (non-blocking)"
        
    - name: Run ruff formatting check
      run: |
        ruff format --check src/ tests/ || echo "Ruff formatting issues found (non-blocking)"
        
    - name: Run mypy type checking
      run: |
        mypy src/ || echo "MyPy type checking found issues (non-blocking)"

  # Test minimum supported Python version with minimal dependencies
  test-min-python:
    name: Test Python 3.8 (minimum supported)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: "3.8"
        
    - name: Install minimum dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .
        
    - name: Run core tests on Python 3.8
      run: |
        python test_py38_compatibility.py
        python -m pytest tests/test_class_method_existence.py tests/test_enums_and_constants.py -v
