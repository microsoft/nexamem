# uv workspace configuration
# This file helps uv understand the project structure and dependencies

# To install with uv:
# uv pip install -e .

# For development:
# uv pip install -e ".[dev]"

# For testing:
# uv pip install -e ".[test]"

# Key uv advantages for NexaMem:
# - Fast dependency resolution
# - Better caching
# - Improved virtual environment handling
# - Compatible with all existing pip workflows

[workspace]
members = ["."]

[dependencies]
# Core dependencies are defined in pyproject.toml
# uv will read them automatically

[dev-dependencies]
# Development dependencies for faster installation with uv
pytest = ">=8.0.0"
build = ">=1.0.0"
ruff = ">=0.1.0"
black = ">=23.0.0"
twine = ">=4.0.0"
